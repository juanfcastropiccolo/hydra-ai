appId: ai.hydra.app
productName: Hydra
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!spikes/*'
  - '!docs/*'
  - '!.sdd/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,README.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,.nvmrc}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.*,playwright.config.*}'
asarUnpack:
  - resources/**
mac:
  target:
    - target: dir
      arch: [x64]
    - target: dmg
      arch: [x64]
  category: public.app-category.developer-tools
  entitlementsInherit: build/entitlements.mac.plist
  identity: null
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
